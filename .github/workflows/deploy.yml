name: Deploy standalone viewer to GitHub Pages

# 単体版（apps/viewer）を GitHub Pages に公開する。main に push したとき、または手動で動かす
# Supabase の接続先はリポジトリの Secrets（VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY）から渡す。値はコードに書かない
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 接続先がないとブラウザ内保存の版になってしまうので、その場合は公開しない
      - name: Check Supabase secrets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Secrets VITE_SUPABASE_URL と VITE_SUPABASE_ANON_KEY を設定してください（Settings > Secrets and variables > Actions）"
            exit 1
          fi
      - run: npm ci
      - run: npm test -w packages/core
      - run: npm run build -w apps/viewer
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/viewer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
